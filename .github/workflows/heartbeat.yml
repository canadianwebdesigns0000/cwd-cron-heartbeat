name: CWD Cron Heartbeat

# WHY THIS EXISTS
# Vercel's built-in cron scheduler stopped firing the team.canadianwebdesigns.ca
# scheduled jobs (lastRunAt: never on all of them). The app + endpoints work fine;
# only the trigger is broken. This workflow is an EXTERNAL trigger ("heartbeat"):
# on each schedule below it curls the matching endpoint, exactly mirroring vercel.json.
# Nothing in the app changes. Endpoints are idempotent (Mongo watermarks + step-dedup),
# so an early/duplicate poke is safe.
#
# Schedules are UTC (same as Vercel crons).
# Re-enabled 2026-11-05 after a 60-day inactivity auto-disable (see keepalive job).

on:
  schedule:
    - cron: '0 9 * * 1'    # renewal-alerts (Mondays)
    - cron: '0 11 * * *'   # leads-digest tier 1 (4PM PKT)
    - cron: '0 16 * * *'   # leads-digest tier 2 (9PM PKT) â€” re-nag leads untouched since tier 1
    - cron: '0 21 * * *'   # leads-digest tier 3 / final (2AM PKT) â€” re-nag leads untouched since tier 2
    - cron: '0 12,17,22 * * *' # qbo-paid-sync 3x/day: 5PM/10PM/3AM PKT (add/update clients+services)
    - cron: '0 13 * * *'   # renewal-invoices LIVE (6PM PKT: run renewals). PnL poke REMOVED 2026-08-31.
    - cron: '0 14 * * *'   # renewal-invoices reconcile (post-billing self-heal)
    - cron: '*/5 * * * *'  # qbo-payment-discord (Vercel was */3; GitHub min is 5m)
    - cron: '30 6 1 * *'   # KEEPALIVE (monthly) - see keepalive job below
  workflow_dispatch:
    inputs:
      target:
        description: 'Exact endpoint path to hit now, e.g. /api/cron/qbo-paid-sync?dry=true (blank = safe connectivity check)'
        required: false
        default: ''

concurrency:
  group: heartbeat-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # KEEPALIVE (added 2026-11-05). GitHub auto-disables scheduled workflows in a
  # public repo after 60 days with no commits ("disabled_inactivity"). That
  # happened on 2026-10-30 and silently stopped EVERY portal cron for 6 days.
  # Re-enabling the workflow through the API once a month resets that 60-day
  # timer, so the schedules never lapse again. No commits needed.
  keepalive:
    if: github.event.schedule == '30 6 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable this workflow (resets the 60-day inactivity timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/ka.txt -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/heartbeat.yml/enable")
          echo "keepalive HTTP $code"; cat /tmp/ka.txt
          if [ "$code" != "204" ]; then echo "::error::keepalive failed ($code)"; exit 1; fi

  poke:
    if: github.event.schedule != '30 6 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled job(s)
        env:
          SCHED: ${{ github.event.schedule }}
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -u
          BASE="https://team.canadianwebdesigns.ca"
          FAIL=0

          poke() {
            path="$1"
            echo "==> POST/GET $path"
            code=$(curl -sS --max-time 60 -o /tmp/body.txt -w "%{http_code}" \
                   -H "x-vercel-cron: 1" "$BASE$path" || echo "000")
            echo "    HTTP $code"
            echo "    $(head -c 300 /tmp/body.txt | tr '\n' ' ')"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::error::$path returned $code"
              FAIL=1
            fi
          }

          case "$SCHED" in
            "0 9 * * 1")    poke "/api/clients/renewal-alerts" ;;
            # 4PM PKT: first daily leads reminder to each rep (all due/overdue leads).
            "0 11 * * *")   poke "/api/cron/leads-digest?tier=1" ;;
            # 9PM PKT: 2nd reminder â€” only leads the rep hasn't updated since tier 1.
            "0 16 * * *")   poke "/api/cron/leads-digest?tier=2" ;;
            # 2AM PKT: final reminder â€” only leads still untouched since tier 2.
            "0 21 * * *")   poke "/api/cron/leads-digest?tier=3" ;;
            # 3x/day 5PM/10PM/3AM PKT (UTC 12/17/22): catch paid invoices â†’ add/update
            # client services. Idempotent (watermark + dedup) so extra runs are safe.
            "0 12,17,22 * * *")  poke "/api/cron/qbo-paid-sync" ;;
            # 6PM PKT: renewals LIVE. Billing is ON (CRON_ENABLED=true in the app); a bare
            # poke creates + emails real renewal invoices and fires reminders (45/30/14/0).
            # PnL poke REMOVED 2026-08-31 at the owner's request: ALL scheduled PnL
            # runs and PnL emails are OFF (also removed from the app's vercel.json,
            # and /api/cron/pnl itself now returns 410). Re-adding a poke here would
            # only produce 410s and failure emails - never a PnL report.
            "0 13 * * *")   poke "/api/cron/renewal-invoices" ;;
            # 7PM PKT: post-billing RECONCILE (safe multi-source status sync QB+Wave+PayPal+
            # clients-DB; creates nothing, emails no one) so the board self-heals after billing.
            "0 14 * * *")   poke "/api/cron/renewal-invoices?reconcile=true" ;;
            # cloud-pharmacy-invoice + -guard pokes REMOVED 2026-08-31.
            # That invoice is MANUAL-ONLY (the Run Now button on /invoices).
            # The app now refuses cron-triggered calls outright, so re-adding a
            # poke here would only produce 403s and failure emails - never an invoice.
            "*/5 * * * *")  poke "/api/cron/qbo-payment-discord" ;;
            "")
              # Manual run. Only hit exactly what the operator asks for.
              if [ -n "$DISPATCH_TARGET" ]; then
                poke "$DISPATCH_TARGET"
              else
                echo "No target given -> safe connectivity check (dry, no side effects)."
                poke "/api/cron/qbo-payment-discord?dry=true"
              fi
              ;;
            *) echo "::warning::Unrecognized schedule '$SCHED' - nothing to do." ;;
          esac

          exit $FAIL

